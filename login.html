<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TravelGo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>TravelGo</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="destination.html">Destinations</a>
            <a href="package.html">Packages</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="login.html">Login</a>
        </div>
    </nav>


    <section class="login-section">

        <div class="login-card">

            <h1>Welcome Back!</h1>
            <p>Login to continue your journey.</p>

            <input type="email" id="loginEmail" placeholder="Enter Email">

            <input type="password" id="loginPassword" placeholder="Enter Password">

            <button onclick="loginUser()">Login</button>

            <p class="account-text">
                Don't have an account?
                <span onclick="showSignup()">Sign Up</span>
            </p>

        </div>


        <div class="login-card signup-card" id="signupBox">

            <h1>Create Account</h1>
            <p>Start your travel journey with us.</p>

            <input type="text" id="signupName" placeholder="Enter Name">

            <input type="email" id="signupEmail" placeholder="Enter Email">

            <input type="password" id="signupPassword" placeholder="Create Password">

            <button onclick="signupUser()">Sign Up</button>

        </div>

    </section>


    <footer>
        <p>© 2026 TravelGo | Tour & Travel</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
